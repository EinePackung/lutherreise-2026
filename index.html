<!DOCTYPE html>

  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>

<body>
  <div id="root"></div>

  <!-- 1. 공통 컴포넌트 (Tape, Stempel, useCountdown 등) -->
  <script type="text/babel" src="components.jsx?v=10"></script>
  <!-- 2. 커버 일러스트 -->

  <script type="text/babel">
    const { useState: useStateApp, useEffect: useEffectApp } = React;

    function App() {
      const countdown = window.useCountdown('2026-06-11T07:00:00');

      return (
        <div className="paper" style={{ minHeight: '100vh', color: 'var(--ink)' }}>
          <div style={{ maxWidth: 1080, margin: '0 auto' }}>
            <Hero countdown={countdown} />
            <ReiseMap />
            <Programm />
            <Gruppen />
            <Dienstplan />
            <Packliste />
            <RSVP />
            <FooterStrip />
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
